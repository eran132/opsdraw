name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        shell: bash
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js validate packages/cli/test/fixtures/arch.mmd
          node packages/cli/dist/index.js import packages/cli/test/fixtures/infra --recursive -o packages/cli/test/fixtures/arch.mmd --check
          node packages/cli/dist/index.js export packages/cli/test/fixtures/arch.mmd -o "$RUNNER_TEMP/arch.svg"
          git diff --exit-code packages/cli/test/fixtures
      - run: npx playwright install --with-deps chromium
        working-directory: packages/app
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: packages/app/playwright-report
