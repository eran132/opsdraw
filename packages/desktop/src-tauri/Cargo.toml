[package]
name = "opsdraw-desktop"
version = "0.1.0"
description = "OpsDraw: architecture as code"
license = "Apache-2.0"
repository = "https://github.com/eran132/opsdraw"
edition = "2021"

[lib]
name = "opsdraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
